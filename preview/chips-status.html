<!doctype html><html><head><meta charset="utf-8"><title>Status Chips</title>
<link rel="stylesheet" href="card.css"></head><body>
<div class="card">
  <div class="label">Status Chips</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px">
    <span class="chip chip-info">In progress</span>
    <span class="chip chip-warning">Author's revision</span>
    <span class="chip chip-error">Rejected</span>
    <span class="chip chip-success">Publication Process</span>
    <span class="chip chip-default">Draft</span>
    <span class="chip chip-overdue">Overdue</span>
  </div>
  <div class="label" style="margin-top:20px">Phase Tags</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px">
    <span class="chip chip-default">Initial Review</span>
    <span class="chip chip-default">Plagiarism Check</span>
    <span class="chip chip-default">Desk Review</span>
    <span class="chip chip-default">Peer Review</span>
    <span class="chip chip-default">Decision Making</span>
    <span class="chip chip-default">Publishing</span>
  </div>
</div>
</body></html>
