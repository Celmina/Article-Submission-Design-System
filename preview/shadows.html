<!doctype html><html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="card.css"></head><body>
<div class="card">
  <div class="label">Elevation</div>
  <div class="grid-4" style="gap:16px;padding:12px 4px">
    <div class="shadow-box" style="box-shadow:0 1px 2px rgba(0,0,0,.04)">shadow-xs</div>
    <div class="shadow-box" style="box-shadow:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.03)">shadow-sm</div>
    <div class="shadow-box" style="box-shadow:0 2px 6px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04)">shadow-md</div>
    <div class="shadow-box" style="box-shadow:0 10px 20px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.04)">shadow-lg</div>
  </div>
  <div class="label" style="margin-top:18px">Icon Tile Shadow</div>
  <div style="display:flex;gap:16px;padding:6px">
    <div style="width:56px;height:56px;background:#1a1a1a;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">K</div>
    <div style="font-size:.75rem;color:#6b6b6b;align-self:center">Stat-card icon tile — charcoal square, shadow-icon</div>
  </div>
</div>
</body></html>
