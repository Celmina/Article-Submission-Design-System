<!doctype html><html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="card.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"></head><body>
<div class="card">
  <div class="label">Material Icons · Filled (24 px)</div>
  <div style="display:grid;grid-template-columns:repeat(8,1fr);gap:18px;color:#1a1a1a">
    <div style="display:flex;flex-direction:column;align-items:center;font-size:.65rem;color:#8e8e93"><span class="material-icons">dashboard</span>dashboard</div>
    <div style="display:flex;flex-direction:column;align-items:center;font-size:.65rem;color:#8e8e93"><span class="material-icons">article</span>article</div>
    <div style="display:flex;flex-direction:column;align-items:center;font-size:.65rem;color:#8e8e93"><span class="material-icons">send</span>send</div>
    <div style="display:flex;flex-direction:column;align-items:center;font-size:.65rem;color:#8e8e93"><span class="material-icons">fact_check</span>review</div>
    <div style="display:flex;flex-direction:column;align-items:center;font-size:.65rem;color:#8e8e93"><span class="material-icons">pending_actions</span>pending</div>
    <div style="display:flex;flex-direction:column;align-items:center;font-size:.65rem;color:#8e8e93"><span class="material-icons">autorenew</span>revision</div>
    <div style="display:flex;flex-direction:column;align-items:center;font-size:.65rem;color:#8e8e93"><span class="material-icons">assignment_turned_in</span>done</div>
    <div style="display:flex;flex-direction:column;align-items:center;font-size:.65rem;color:#8e8e93"><span class="material-icons">menu_book</span>journals</div>
    <div style="display:flex;flex-direction:column;align-items:center;font-size:.65rem;color:#8e8e93"><span class="material-icons">group</span>users</div>
    <div style="display:flex;flex-direction:column;align-items:center;font-size:.65rem;color:#8e8e93"><span class="material-icons">insights</span>reports</div>
    <div style="display:flex;flex-direction:column;align-items:center;font-size:.65rem;color:#8e8e93"><span class="material-icons">settings</span>settings</div>
    <div style="display:flex;flex-direction:column;align-items:center;font-size:.65rem;color:#8e8e93"><span class="material-icons">notifications</span>bell</div>
    <div style="display:flex;flex-direction:column;align-items:center;font-size:.65rem;color:#8e8e93"><span class="material-icons">search</span>search</div>
    <div style="display:flex;flex-direction:column;align-items:center;font-size:.65rem;color:#8e8e93"><span class="material-icons">upload_file</span>upload</div>
    <div style="display:flex;flex-direction:column;align-items:center;font-size:.65rem;color:#8e8e93"><span class="material-icons">download</span>download</div>
    <div style="display:flex;flex-direction:column;align-items:center;font-size:.65rem;color:#8e8e93"><span class="material-icons">logout</span>logout</div>
  </div>
</div>
</body></html>
