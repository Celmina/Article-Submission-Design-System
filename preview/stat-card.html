<!doctype html><html><head><meta charset="utf-8"><title>Stat Card</title>
<link rel="stylesheet" href="card.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"></head><body>
<div class="card" style="padding:18px 20px">
  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <div>
      <div style="font-size:.78rem;color:#6b6b6b">Bookings</div>
      <div style="font-size:1.75rem;font-weight:700;color:#1a1a1a;margin-top:4px">281</div>
    </div>
    <div style="width:48px;height:48px;background:#1a1a1a;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.15)">
      <span class="material-icons" style="font-size:22px">print</span>
    </div>
  </div>
  <div style="height:1px;background:#eeeeee;margin:14px 0 10px"></div>
  <div style="font-size:.78rem;color:#6b6b6b"><span style="color:#2e7d32;font-weight:700">+55%</span> than last week</div>
</div>
</body></html>
