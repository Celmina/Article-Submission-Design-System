<!doctype html><html><head><meta charset="utf-8"><title>Card Pattern</title>
<link rel="stylesheet" href="card.css"></head><body>
<div class="card" style="padding:0;overflow:hidden">
  <div style="padding:20px 24px">
    <div style="font-size:1rem;font-weight:600;color:#1a1a1a">Website Views</div>
    <div style="font-size:.78rem;color:#6b6b6b;margin-top:2px">Last Campaign Performance</div>
    <div style="height:120px;margin-top:14px;background:#fafafa;border-radius:10px"></div>
  </div>
  <div style="padding:10px 24px;border-top:1px solid #eeeeee;font-size:.72rem;color:#8e8e93;display:flex;align-items:center;gap:6px">
    <span class="material-icons" style="font-size:14px">schedule</span>
    campaign sent 2 days ago
  </div>
</div>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</body></html>
