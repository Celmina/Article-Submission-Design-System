<!doctype html><html><head><meta charset="utf-8"><title>Form Inputs</title>
<link rel="stylesheet" href="card.css"></head><body>
<div class="card">
  <div class="label">Form Inputs</div>
  <div class="grid-2">
    <div>
      <label class="input-label">Article Title</label>
      <input class="input" value="Adaptive Bio-signal Processing in Edge Devices">
    </div>
    <div>
      <label class="input-label">Journal</label>
      <input class="input" value="Journal of Applied Informatics">
    </div>
    <div>
      <label class="input-label">Email · Error state</label>
      <input class="input" value="not-an-email" style="border-color:#F44335">
      <div style="font-size:.7rem;color:#F44335;margin-top:4px">Please enter a valid email address.</div>
    </div>
    <div>
      <label class="input-label">ORCID · Focused</label>
      <input class="input" value="0000-0001-2345-6789" style="border-color:#1a1a1a" autofocus>
    </div>
  </div>
</div>
</body></html>
